<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#199ecf" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PointHub</title>
    <!--
      Cascade layer order, fixed before any stylesheet loads. Chakra emits `reset, base, tokens, recipes`.
      LEGACY: `mantine` holds the styles of the not-yet-ported host/admin pages (src/legacy). It sits above
      Chakra's reset so Mantine components keep their own spacing, and below `base` so the page background,
      text colour and fonts stay Chakra's. Remove `mantine` from this list together with src/legacy.
    -->
    <style>
      @layer reset, mantine, base, tokens, recipes;
    </style>
    <script>
      // Colour scheme before first paint (the same rule as src/themes/colorMode.ts).
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem('pointhub.colorScheme') || localStorage.getItem('mantine-color-scheme-value');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(mode);
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
